<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Google Analytics 4. Enhanced measurement records SPA route changes as page views. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S15X2MD2PV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-S15X2MD2PV');
    </script>
    <meta name="theme-color" content="#131412" />
    <link rel="icon" href="/logo.avif" type="image/avif" />

    <link rel="preload" href="/fonts/syne-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- seo:start — filled per route by scripts/prerender.mjs at build time (src/data/seo.ts) -->
    <title>Parth Pandey — Shopify Web Developer | Themes, Apps &amp; Migrations</title>
    <meta name="description" content="" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.partheazpandey.space/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Parth Pandey" />
    <meta property="og:url" content="https://www.partheazpandey.space/" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="https://www.partheazpandey.space/images/og/default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="" />
    <meta name="twitter:description" content="" />
    <meta name="twitter:image" content="https://www.partheazpandey.space/images/og/default.jpg" />
    <script type="application/ld+json" id="ld-json"></script>
    <!-- seo:end -->
    <!-- The prerendered copy of the page in #root is for crawlers; with JS on, React replaces it. -->
    <style>.js [data-prerender] { display: none; }</style>
    <!-- Flags JS so reveal hidden states only apply when they can be undone, and picks the
         saved theme (dark by default) before first paint so there is no flash. -->
    <script>
      (function () {
        var d = document.documentElement, t = "dark";
        d.classList.add("js");
        try { var s = localStorage.getItem("pp_theme"); if (s === "light" || s === "dark") t = s; } catch (e) {}
        d.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === "light" ? "#F2EDE4" : "#131412";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
